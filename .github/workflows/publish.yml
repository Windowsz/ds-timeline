name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'   # triggers on v2.1.0, v2.2.0, etc.

jobs:
  publish:
    name: Build & Publish
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build:lib

      - name: Verify version matches tag
        run: |
          PKG_VERSION=$(node -p "require('./projects/ds-timeline/package.json').version")
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "❌ package.json version ($PKG_VERSION) does not match tag ($TAG_VERSION)"
            exit 1
          fi
          echo "✅ Version $PKG_VERSION matches tag"

      - name: Publish to npm
        run: npm publish --access public
        working-directory: projects/ds-timeline/dist
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
